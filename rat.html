<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Associates Test</title>
<!-- Remote Associates Test, presented as in Bowden & Beeman (2003):
     fixation cross, then the three words above, at and below the center. -->
<link rel="stylesheet" href="word-game.css">
</head>
<body>

<section id="start" class="screen">
  <p>In each problem you will see three words. Find a fourth word that goes with all three, for example:</p>
  <p class="example">pine / crab / sauce &rarr; apple</p>
  <p>Type your answer and press Enter. You have 15 seconds per problem and 5 minutes in total. Solve as many as you can.</p>
  <button id="start-button">Start</button>
</section>

<script>
// In order, from easier to harder. Some problems accept more than one answer.
const problems = [
  { lines: ['cottage', 'swiss', 'cake'], answers: ['cheese'] },
  { lines: ['cream', 'skate', 'water'], answers: ['ice'] },
  { lines: ['loser', 'throat', 'spot'], answers: ['sore'] },
  { lines: ['show', 'life', 'row'], answers: ['boat'] },
  { lines: ['night', 'wrist', 'stop'], answers: ['watch'] },
  { lines: ['duck', 'fold', 'dollar'], answers: ['bill'] },
  { lines: ['rocking', 'wheel', 'high'], answers: ['chair'] },
  { lines: ['dew', 'comb', 'bee'], answers: ['honey'] },
  { lines: ['fountain', 'baking', 'pop'], answers: ['soda'] },
  { lines: ['preserve', 'ranger', 'tropical'], answers: ['forest'] },
  { lines: ['aid', 'rubber', 'wagon'], answers: ['band'] },
  { lines: ['flake', 'mobile', 'cone'], answers: ['snow'] },
  { lines: ['cracker', 'fly', 'fighter'], answers: ['fire'] },
  { lines: ['safety', 'cushion', 'point'], answers: ['pin'] },
  { lines: ['cane', 'daddy', 'plum'], answers: ['sugar'] },
  { lines: ['dream', 'break', 'light'], answers: ['day'] },
  { lines: ['fish', 'mine', 'rush'], answers: ['gold'] },
  { lines: ['political', 'surprise', 'line'], answers: ['party'] },
  { lines: ['measure', 'worm', 'video'], answers: ['tape'] },
  { lines: ['high', 'district', 'house'], answers: ['school', 'court'] },
  { lines: ['sense', 'courtesy', 'place'], answers: ['common'] },
  { lines: ['worm', 'shelf', 'end'], answers: ['book'] },
  { lines: ['piece', 'mind', 'dating'], answers: ['game'] },
  { lines: ['flower', 'friend', 'scout'], answers: ['girl'] },
  { lines: ['river', 'note', 'account'], answers: ['bank'] },
  { lines: ['print', 'berry', 'bird'], answers: ['blue'] },
  { lines: ['pie', 'luck', 'belly'], answers: ['pot'] },
  { lines: ['date', 'alley', 'fold'], answers: ['blind'] },
  { lines: ['opera', 'hand', 'dish'], answers: ['soap'] },
  { lines: ['cadet', 'capsule', 'ship'], answers: ['space'] },
  { lines: ['fur', 'rack', 'tail'], answers: ['coat'] },
  { lines: ['stick', 'maker', 'point'], answers: ['match'] },
  { lines: ['hound', 'pressure', 'shot'], answers: ['blood'] },
];
</script>
<script src="word-game.js"></script>
</body>
</html>
